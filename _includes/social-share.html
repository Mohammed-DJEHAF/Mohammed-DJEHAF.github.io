{% include base_path %}
{% assign share_url = base_path | append: page.url | url_encode %}
<section class="page__share">
  <h4 class="page__share-title">{{ site.data.ui-text[site.locale].share_on_label | default: "Share on" }}</h4>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}" class="btn btn--linkedin" title="Share on LinkedIn" target="_blank" rel="noopener"><i class="fab fa-linkedin" aria-hidden="true"></i><span> LinkedIn</span></a>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}" class="btn btn--facebook" title="Share on Facebook" target="_blank" rel="noopener"><i class="fab fa-facebook" aria-hidden="true"></i><span> Facebook</span></a>
  <a href="https://x.com/intent/post?url={{ share_url }}" class="btn btn--x" title="Share on X" target="_blank" rel="noopener"><i class="fab fa-x-twitter" aria-hidden="true"></i><span> X</span></a>
  <a href="https://bsky.app/intent/compose?text={{ share_url }}" class="btn btn--bluesky" title="Share on Bluesky" target="_blank" rel="noopener"><i class="fab fa-bluesky" aria-hidden="true"></i><span> Bluesky</span></a>
</section>
